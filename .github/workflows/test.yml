name: Test AI Agent Features

# Runs on GitHub's Ubuntu runners (Docker), so none of the local podman
# workarounds are needed here.

on:
  push:
    branches:
      - main
      - master
  pull_request: {}
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Test install-only features
        run: |
          devcontainer features test \
            --project-folder . \
            --features ai-codex ai-claude \
            --base-image mcr.microsoft.com/devcontainers/base:ubuntu \
            --remote-user vscode

      - name: Test full stack (global scenario)
        run: devcontainer features test --project-folder . --global-scenarios-only
